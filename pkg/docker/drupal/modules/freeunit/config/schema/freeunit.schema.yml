freeunit.settings:
  type: config_object
  label: 'FreeUnit settings'
  mapping:
    static_cache:
      type: mapping
      label: 'Router-served static page cache'
      mapping:
        enabled:
          type: boolean
          label: 'Write anonymous pages to files for the FreeUnit router'
        directory:
          type: string
          label: 'Cache directory (outside the docroot, readable by the router user)'
        hosts:
          type: sequence
          label: 'Host names served from the cache'
          sequence:
            type: string
        scheme:
          type: string
          label: 'Scheme the router sees for those hosts (http or https)'
        gzip:
          type: boolean
          label: 'Also write a precompressed .gz variant'
        max_bytes:
          type: integer
          label: 'Largest page to write, in bytes'
        headers:
          type: sequence
          label: 'Response headers (lower-case name: exact value) the route reproduces'
          sequence:
            type: string
    control:
      type: mapping
      label: 'FreeUnit control API'
      mapping:
        socket:
          type: string
          label: 'Control socket path (used from Drush only)'
        application:
          type: string
          label: 'Application name in the FreeUnit configuration'
        target:
          type: string
          label: 'Application target for Drupal''s front controller'
    cron:
      type: mapping
      label: 'Cron through a FreeUnit schedule'
      mapping:
        schedule_name:
          type: string
          label: 'Schedule name'
        interval:
          type: integer
          label: 'Interval, in seconds'
        jitter:
          type: integer
          label: 'Jitter, in seconds'
        timeout:
          type: integer
          label: 'Timeout, in seconds'
        host:
          type: string
          label: 'Host header for the run (must pass trusted_host_patterns)'

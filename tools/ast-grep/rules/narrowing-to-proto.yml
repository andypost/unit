id: narrowing-to-proto
language: c
severity: warning
message: >-
  A length/size value is cast directly to a narrower integer type. Use
  nxt_size_to_uint32()/nxt_size_to_uint16() etc. (src/nxt_checked.h) instead
  of a bare cast, so a value that does not fit is rejected rather than
  silently truncated onto the wire or into a protocol field.
rule:
  any:
    - pattern: (uint8_t) $X->$LENFIELD
    - pattern: (uint16_t) $X->$LENFIELD
    - pattern: (uint32_t) $X->$LENFIELD
constraints:
  LENFIELD:
    regex: "(len|length|size)$"

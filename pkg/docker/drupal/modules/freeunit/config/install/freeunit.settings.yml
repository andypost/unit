static_cache:
  enabled: false
  directory: /var/lib/drupal-freeunit/page-cache
  # Host names the FreeUnit route serves from the cache; nothing is written
  # for any other Host header.
  hosts: []
  gzip: true
  max_bytes: 2097152
  # Response headers the router route reproduces (their values must be the
  # same for every cached page) or that may be dropped.  A page whose
  # response has any other header is not written.
  reproduced_headers:
    - cache-control
    - content-language
    - content-type
    - expires
    - vary
    - x-content-type-options
    - x-frame-options
    - x-drupal-cache
  dropped_headers:
    - date
    - etag
    - last-modified
    - link
    - x-drupal-cache-tags
    - x-drupal-cache-contexts
    - x-drupal-cache-max-age
    - x-drupal-dynamic-cache
    - x-generator
    - x-ua-compatible
control:
  socket: /var/run/control.unit.sock
  application: drupal
  target: index
cron:
  schedule_name: drupal-cron
  interval: 300
  jitter: 30
  timeout: 240
  host: ''

# UNVERIFIED PROTOTYPE: never installed on a Drupal site. See README.md.
#
# The class-name aliases let core autowire src/Hook/FreeUnitHooks and Drush
# autowire src/Drush/Commands/FreeUnitCommands.
services:
  logger.channel.freeunit:
    parent: logger.channel_base
    arguments: ['freeunit']

  freeunit.static_cache.path_mapper:
    class: Drupal\freeunit\StaticCache\StaticCachePathMapper
    arguments: ['@config.factory']
  Drupal\freeunit\StaticCache\StaticCachePathMapper: '@freeunit.static_cache.path_mapper'

  freeunit.static_cache.index:
    class: Drupal\freeunit\StaticCache\StaticCacheIndex
    arguments: ['@database']

  freeunit.static_cache.files:
    class: Drupal\freeunit\StaticCache\StaticCacheFiles
    arguments: ['@freeunit.static_cache.path_mapper', '@logger.channel.freeunit']

  # Writes anonymous page-cache responses to files after the response has
  # been sent (kernel.terminate, after fastcgi_finish_request()).
  freeunit.static_cache.writer:
    class: Drupal\freeunit\EventSubscriber\StaticCacheWriter
    arguments:
      - '@config.factory'
      - '@current_user'
      - '@session_configuration'
      - '@cache.page'
      - '@freeunit.static_cache.path_mapper'
      - '@freeunit.static_cache.files'
      - '@freeunit.static_cache.index'
      - '@logger.channel.freeunit'
    tags:
      - { name: event_subscriber }

  # Deletes the files whose cache tags are invalidated.  Collected by
  # cache_tags.invalidator (core.services.yml, tag cache_tags_invalidator).
  freeunit.static_cache.invalidator:
    class: Drupal\freeunit\Cache\StaticCacheTagsInvalidator
    arguments: ['@freeunit.static_cache.index', '@freeunit.static_cache.files']
    tags:
      - { name: cache_tags_invalidator }
      - { name: event_subscriber }
  Drupal\freeunit\Cache\StaticCacheTagsInvalidator: '@freeunit.static_cache.invalidator'

  freeunit.control_api:
    class: Drupal\freeunit\Control\ControlApiClient
    factory: ['Drupal\freeunit\Control\ControlApiClient', 'fromConfig']
    arguments: ['@config.factory']
  Drupal\freeunit\Control\ControlApiClient: '@freeunit.control_api'

  freeunit.schedule_generator:
    class: Drupal\freeunit\Schedule\ScheduleConfigGenerator
    arguments: ['@config.factory', '@state']
  Drupal\freeunit\Schedule\ScheduleConfigGenerator: '@freeunit.schedule_generator'

  freeunit.route_generator:
    class: Drupal\freeunit\StaticCache\RouteConfigGenerator
    arguments: ['@config.factory', '@session_configuration', '@freeunit.static_cache.path_mapper']
  Drupal\freeunit\StaticCache\RouteConfigGenerator: '@freeunit.route_generator'

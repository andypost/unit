id: memcpy-computed-size
language: c
severity: warning
message: >-
  memcpy()/memmove() size is a computed expression (an addition or
  subtraction), not a single checked variable. Compute it with
  nxt_size_add()/nxt_size_sub() (src/nxt_checked.h) first and pass the
  checked result, so a wrapped size cannot turn into an overread/overwrite.
rule:
  any:
    - pattern: memcpy($DST, $SRC, $A + $B)
    - pattern: memcpy($DST, $SRC, $A - $B)
    - pattern: memmove($DST, $SRC, $A + $B)
    - pattern: memmove($DST, $SRC, $A - $B)

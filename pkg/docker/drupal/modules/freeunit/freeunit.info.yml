# UNVERIFIED PROTOTYPE: never installed on a Drupal site. See README.md.
name: FreeUnit
type: module
description: 'Integrates Drupal with the FreeUnit application server: a router-served static page cache, cron through FreeUnit schedules, and deployment and status helpers.'
package: Performance
# 11.1 brought attribute (OOP) hooks, 11.2 hook_runtime_requirements() and
# RequirementSeverity, both of which src/Hook uses.
core_version_requirement: ^11.2 || ^12
dependencies:
  - drupal:page_cache
# The settings form (route freeunit.settings) is designed in
# docs/drupal/freeunit-module.md but not part of this skeleton.

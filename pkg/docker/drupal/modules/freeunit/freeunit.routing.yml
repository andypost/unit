# UNVERIFIED PROTOTYPE.
#
# Reached only by the FreeUnit schedule: the listener's routes answer 404 for
# /freeunit/cron (examples/unit-drupal-freeunit.json), and a schedule passes
# straight to the application, so it never meets those routes.  The key
# travels in a header, not in the URI, so it is not in the access log.
freeunit.cron:
  path: '/freeunit/cron'
  defaults:
    _controller: '\Drupal\freeunit\Controller\CronController::run'
  methods: [GET]
  requirements:
    _access: 'TRUE'
  options:
    no_cache: TRUE

# Machine-readable contract for the nxt_conn_t lifecycle.
#
# This file is the single source for:
#   - the transition table and the Mermaid diagram in docs/fsm/conn.md
#     (generated by tools/fsm/render.py, never edited by hand);
#   - the trace replay done by tools/fsm/trace_check.py on a --debug unit.log.
#
# Every `cite` is file:line on master (eb1767c9).  Verdicts:
#   transition  the event moves the conn to `to` (`same` = stays put);
#   ignored     the event can happen but the code makes it a no-op;
#   impossible  the code structure (or every caller) prevents the event;
#   bug         the code allows the event and the result is wrong.  See the
#               mismatch inventory in conn.md (M-n).
#
# A cell may carry `when: {group: value}`: it applies only when the logged
# values match (value "!0" means "not 0").  Guarded cells come first; the
# cell without `when` (or the event default) is the fallback.

machine: nxt_conn_t lifecycle
source_commit: eb1767c9
initial: FREE

states:
  FREE:
    summary: struct not allocated, or recycled on engine->free_connections.
    repr: >-
      c on engine->free_connections (nxt_conn.c:271-272) or not yet
      allocated.  Nothing may hold a pointer to it.
    cite: [nxt_conn.c:67-70, nxt_conn.c:271-272]
  CREATED:
    summary: nxt_conn_create() returned; no fd yet.
    repr: >-
      c->socket.fd == -1 (nxt_conn.c:88), c->idle == NXT_CONN_TRACK_NONE
      (zeroed at nxt_conn.c:70/:73), read_state/write_state NULL, both timers
      quiescent, c->socket.task == &c->task (nxt_conn.c:116-118),
      engine->connections counted (nxt_conn.c:99).  Covers the listener's
      spare conn lev->next (nxt_conn_accept.c:111) and an upstream peer
      before connect (nxt_h1proto.c:2361-2411).
    cite: [nxt_conn.c:49-133]
  CONNECTING:
    summary: outgoing socket created, connect(2) in progress.
    repr: >-
      c->socket.fd >= 0 (nxt_conn_connect.c:104); write fd-event ACTIVE and
      c->socket.write_handler == nxt_conn_connect_test
      (nxt_conn_connect.c:54,:61) or nxt_epoll_edge_conn_connected
      (nxt_epoll_engine.c:1121-1128); write timer from write_state
      (nxt_conn_connect.c:59).
    cite: [nxt_conn_connect.c:35-74, nxt_epoll_engine.c:1101-1160]
  OPEN:
    summary: fd open, I/O possible, no close scheduled.
    repr: >-
      c->socket.fd >= 0; c->socket.error_handler is the current state's
      error_handler (nxt_conn_read.c:29,:64; nxt_conn_write.c:41);
      c->idle is NONE, IDLE or ACTIVE (nxt_conn.h:170-185).  Read and write
      directions are independent sub-machines (conn.md section 4).
    cite: [nxt_conn_read.c:38-128, nxt_conn_write.c:17-154]
  CLOSING:
    summary: nxt_conn_close() ran; phase-1/2 handler queued.  Phase 0.
    repr: >-
      c->write == NULL (nxt_conn_close.c:37); c->socket.error_handler ==
      nxt_conn_close_error_ignore (nxt_conn_close.c:59); a work item on
      engine->shutdown_work_queue or engine->close_work_queue
      (nxt_conn_close.c:61-70).  The fd is still open and still in the
      event set.  c->read and block_read are untouched (see M-2).
    cite: [nxt_conn_close.c:19-71]
  SHUTDOWN:
    summary: nxt_conn_shutdown_handler() ran.  Phase 1.
    repr: >-
      c->socket.shutdown == 1 (nxt_conn_close.c:85); shutdown(2) issued
      (nxt_conn_close.c:87); nxt_conn_close_handler queued on
      engine->close_work_queue (nxt_conn_close.c:89-90).
    cite: [nxt_conn_close.c:75-91]
  CLOSE_PENDING:
    summary: nxt_conn_close_handler() ran; the fd close is deferred.  Phase 2.
    repr: >-
      Both timers deleted (nxt_conn_close.c:113-114); EPOLL_CTL_DEL batched
      (nxt_conn_close.c:116, nxt_epoll_engine.c:406-412); c->write_timer is
      the 0 ms close timer with handler nxt_conn_close_timer_handler
      (nxt_conn_close.c:132-135).  The fd is still open when
      events_pending != 0 (nxt_conn_close.c:118), else it was closed inline
      (:119-122) and only a timer change is pending.
    cite: [nxt_conn_close.c:95-136]
  FD_CLOSED:
    summary: fd released, conn untracked; owner's release handler queued.
    repr: >-
      c->socket.fd == -1 (nxt_conn_close.c:120,:156); c->idle == NONE
      (nxt_conn_close.c:122,:158); c->write_state->ready_handler queued on
      engine->fast_work_queue (nxt_conn_close.c:125-127,:161-162).
    cite: [nxt_conn_close.c:118-129, nxt_conn_close.c:140-163]
  RELEASED:
    summary: nxt_conn_free() ran; struct parked until the engine drains.  Phase 3.
    repr: >-
      engine->connections-- (nxt_conn.c:143); c->idle == NONE asserted
      (nxt_conn.c:180); timers deleted (nxt_conn.c:183-184); c on
      engine->pending_connections (nxt_conn.c:200-201); c->mem_pool
      released (nxt_conn.c:204-206).  The struct memory is still valid
      (engine->mem_pool) but must not be touched.
    cite: [nxt_conn.c:137-207]

events:
  create:
    summary: nxt_conn_create(mp, task).
    cite: [nxt_conn.c:49-133]
    default: {verdict: impossible, note: "create allocates a new struct; an existing struct is re-zeroed only after recycle (nxt_conn.c:70)."}
  accept:
    summary: accept(2)/accept4(2) succeeded and nxt_conn_accept() ran on lev->next.
    cite: [nxt_conn_accept.c:136-196, nxt_conn_accept.c:200-243, nxt_epoll_engine.c:1012-1046]
    default: {verdict: impossible, note: "only lev->next, a CREATED spare, is handed to accept (nxt_conn_accept.c:145, nxt_epoll_engine.c:1022)."}
  connect:
    summary: nxt_conn_connect() -> nxt_conn_sys_socket() -> io->connect().
    cite: [nxt_conn.h:292-294, nxt_conn_connect.c:14-31, nxt_conn_connect.c:35-74]
    default: {verdict: impossible, note: "connect needs c->socket.fd == -1 and no fd-event; every caller connects a fresh conn (nxt_h1proto.c:2411, nxt_conn_proxy.c:116,:842)."}
  connected:
    summary: connect(2) completed (inline NXT_OK, nxt_conn_connect_test, or the epoll edge fast path).
    cite: [nxt_conn_connect.c:48-51, nxt_conn_connect.c:134-157, nxt_epoll_engine.c:1137-1160]
    default: {verdict: impossible, note: "only the write handler installed while CONNECTING produces this event; it blocks the write fd-event before dispatching (nxt_conn_connect.c:143, nxt_epoll_engine.c:1146)."}
  wait:
    summary: nxt_conn_wait() arms read readiness without a buffer.
    cite: [nxt_conn_read.c:11-34]
    default: {verdict: impossible, note: "no caller; the function has no guard, so a call here would re-arm read on a closing or closed fd."}
  read:
    summary: nxt_conn_io_read() runs (queued by nxt_conn_read() or by an EPOLLIN dispatch).
    cite: [nxt_conn.h:297-305, nxt_conn_read.c:38-128]
    default: {verdict: impossible, note: "no fd (CREATED) or no handler can be queued any more (FD_CLOSED, RELEASED: the fd-event was deleted before the fd was closed, CONN-INV-8)."}
  write:
    summary: nxt_conn_io_write() runs (queued by nxt_conn_write() or by an EPOLLOUT dispatch).
    cite: [nxt_conn.h:308-316, nxt_conn_write.c:17-154]
    default: {verdict: impossible, note: "no fd (CREATED) or no handler can be queued any more (FD_CLOSED, RELEASED)."}
  io:
    summary: a socket syscall on c->socket.fd (recv, readv, send, writev, sendfile).
    cite: [nxt_conn_read.c:132-252, nxt_conn_write.c:174-401]
    default: {verdict: impossible, note: "only reached from read/write handlers; in CLOSING and later it means an unguarded handler ran (M-2) or the fd was closed (FD_CLOSED, RELEASED: EBADF or I/O on a reused descriptor)."}
  fd_ready:
    summary: the engine dispatches kernel readiness for c->socket (EPOLLIN/EPOLLOUT/EPOLLERR/EPOLLHUP).
    cite: [nxt_epoll_engine.c:918-1007]
    default: {verdict: impossible, note: "CLOSING/SHUTDOWN/CLOSE_PENDING all complete inside one work-queue drain (nxt_event_engine.c:521-545) and the EPOLL_CTL_DEL is committed before the next epoll_wait (nxt_epoll_engine.c:888-890), so no readiness can be delivered after nxt_conn_close(); a closed fd is not in the set."}
  fd_arm:
    summary: EPOLL_CTL_ADD or EPOLL_CTL_MOD batched for c->socket (enable_read/enable_write/enable).
    cite: [nxt_epoll_engine.c:415-462, nxt_epoll_engine.c:592-611]
    default: {verdict: impossible, note: "no fd (CREATED), or only reachable through an unguarded handler (CLOSING/SHUTDOWN, M-2); after the DEL of phase 2 any ADD/MOD would re-register a closing fd (CLOSE_PENDING) or a closed one."}
  fd_del:
    summary: EPOLL_CTL_DEL batched for c->socket (disable_read/disable_write/disable/delete/close).
    cite: [nxt_epoll_engine.c:371-394, nxt_epoll_engine.c:465-506]
    default: {verdict: impossible, note: "the DEL of phase 2 is batched with the conn already in CLOSE_PENDING; nothing else deletes the fd-event of a closing conn."}
  timer_add:
    summary: nxt_timer_add() on c->read_timer or c->write_timer.
    cite: [nxt_conn.c:282-295, nxt_timer.c:70-101]
    default: {verdict: impossible, note: "timers are armed only from wait/read/write/connect (nxt_conn.c:292) and from the close handler; nothing arms a timer of a closed or released conn (nxt_conn.c:183-184 deletes both)."}
  close:
    summary: nxt_conn_close(engine, c).
    cite: [nxt_conn_close.c:19-71]
    default: {verdict: impossible, note: "see the per-state cells."}
  shutdown_handler:
    summary: nxt_conn_shutdown_handler() runs from engine->shutdown_work_queue.
    cite: [nxt_conn_close.c:75-91]
    default: {verdict: impossible, note: "queued only by nxt_conn_close() (nxt_conn_close.c:62-63,:70)."}
  close_handler:
    summary: nxt_conn_close_handler() runs from engine->close_work_queue.
    cite: [nxt_conn_close.c:95-136]
    default: {verdict: impossible, note: "queued only by nxt_conn_close() (nxt_conn_close.c:66-67) or by the shutdown handler (nxt_conn_close.c:89-90)."}
  close_timer:
    summary: nxt_conn_close_timer_handler() runs (0 ms write timer).
    cite: [nxt_conn_close.c:140-163]
    default: {verdict: impossible, note: "installed only by the close handler (nxt_conn_close.c:132-135); nxt_conn_free() deletes it (nxt_conn.c:184)."}
  fd_close:
    summary: close(2) of c->socket.fd via nxt_socket_close().
    cite: [nxt_socket.c:283-310, nxt_conn_close.c:119, nxt_conn_close.c:155]
    default: {verdict: impossible, note: "the conn's fd is closed only by the close handler or the close timer; a second close(2) of the same number would hit an unrelated, reused descriptor."}
  free:
    summary: nxt_conn_free(task, c).
    cite: [nxt_conn.c:137-207]
    default: {verdict: impossible, note: "see the per-state cells."}
  recycle:
    summary: nxt_conn_recycle_pending() promotes parked structs to the freelist.
    cite: [nxt_conn.c:257-278, nxt_event_engine.c:525-539]
    default: {verdict: impossible, note: "only engine->pending_connections is walked."}
  idle_reclaim:
    summary: an idle conn is picked to be closed (fd pressure or runtime quit).
    cite: [nxt_conn_accept.c:284-328, nxt_runtime.c:495-516]
    default: {verdict: impossible, note: "only conns on engine->idle_connections are visited; every close path moves the conn to active or untracks it first (CONN-INV-6)."}

transitions:
  # --- create
  - {event: create, from: [FREE], to: CREATED, verdict: transition,
     note: "recycled struct re-zeroed (nxt_conn.c:67-70) or fresh from engine->mem_pool (:73); engine->connections++ (:99).",
     cite: [nxt_conn.c:65-99]}

  # --- accept
  - {event: accept, from: [CREATED], to: OPEN, verdict: transition,
     note: "fd assigned (nxt_conn_accept.c:180 / nxt_epoll_engine.c:1041); c->idle = IDLE (nxt_conn_accept.c:215); lev->count++ (:218); listen handler queued (:229-234).  Requires c == lev->next.",
     cite: [nxt_conn_accept.c:200-243]}

  # --- connect
  - {event: connect, from: [CREATED], to: CONNECTING, verdict: transition,
     note: "socket(2) (nxt_conn_connect.c:87,:104).  NXT_OK: write_ready = 1 and ready_handler queued, the conn is already OPEN (:48-51,:73).  NXT_AGAIN: write handler + timer + enable_write (:53-62).  NXT_DECLINED/NXT_ERROR: close/error handler queued with the fd still open (:64-73).  socket(2) failure: error_handler queued, fd stays -1, the conn stays CREATED (:25-30).",
     cite: [nxt_conn_connect.c:14-74]}

  # --- connected
  - {event: connected, from: [CONNECTING], to: OPEN, verdict: transition,
     note: "write fd-event blocked (nxt_conn_connect.c:143, nxt_epoll_engine.c:1146); autoreset write timer disabled (:145-147); ready_handler queued (:152), or on SO_ERROR the close/error handler via nxt_conn_connect_error (:155,:161-196).  Either way the fd is open and must be closed by the owner.",
     cite: [nxt_conn_connect.c:134-196]}

  - {event: connected, from: [OPEN], verdict: ignored,
     note: "the epoll edge fast path defers to nxt_conn_connect_test() when the EPOLLOUT came with EPOLLERR/EPOLLHUP (nxt_epoll_engine.c:1157), so one completion logs both `epoll event conn connected` and `event connect test`.",
     cite: [nxt_epoll_engine.c:1147-1158]}

  # --- wait
  - {event: wait, from: [OPEN], to: OPEN, verdict: transition,
     note: "read_ready: ready_handler queued at once (nxt_conn_read.c:22-25); else read_handler = ready_handler, error_handler, read timer, enable_read (:28-33).",
     cite: [nxt_conn_read.c:11-34]}
  - {event: wait, from: [CONNECTING], to: CONNECTING, verdict: impossible,
     note: "no caller waits on a connecting socket; nxt_conn_proxy waits on the client only (nxt_conn_proxy.c:124-126)."}

  # --- read
  - {event: read, from: [OPEN], to: OPEN, verdict: transition,
     note: "guard: socket.error != 0 or c->block_read returns silently (nxt_conn_read.c:52-54).  n > 0: fd read BLOCKED, autoreset timer disabled, ready_handler queued (:77-91).  n == 0: socket.closed = 1 (:168,:220), close_handler queued (:93-102).  NXT_ERROR: socket.error set (:187,:244), error_handler queued.  NXT_AGAIN: enable_read if disabled (:121-123), timer (:125-127).",
     cite: [nxt_conn_read.c:38-128]}
  - {event: read, from: [CONNECTING], to: CONNECTING, verdict: impossible,
     note: "no caller reads before connected; on Linux recv() on an unconnected socket returns EAGAIN (comment nxt_epoll_engine.c:1110-1115)."}
  - {event: read, from: [CLOSING, SHUTDOWN, CLOSE_PENDING], verdict: ignored,
     when: {bl: "1"},
     note: "the owner set c->block_read before nxt_conn_close(); the handler returns at nxt_conn_read.c:52-54.",
     cite: [nxt_conn_read.c:52-54]}
  - {event: read, from: [CLOSING, SHUTDOWN, CLOSE_PENDING], verdict: ignored,
     when: {er: "!0"},
     note: "socket.error != 0; the handler returns at nxt_conn_read.c:52-54.",
     cite: [nxt_conn_read.c:52-54]}
  - {event: read, from: [CLOSING, SHUTDOWN, CLOSE_PENDING], verdict: bug,
     note: "a queued read handler runs unguarded (bl:0, er:0) on a closing conn: nxt_conn_close() does not block reads or clear c->read (nxt_conn_close.c:37 clears only c->write), so it recv()s on the closing fd and dispatches read_state handlers, which in h1proto re-enter nxt_h1p_shutdown() -> second nxt_conn_close() (M-3).  M-2.",
     cite: [nxt_conn_read.c:52-54, nxt_conn_close.c:37]}

  # --- write
  - {event: write, from: [OPEN], to: OPEN, verdict: transition,
     note: "socket.error != 0 or c->block_write: write_state->error_handler queued (nxt_conn_write.c:30-32,:150-153).  !write_ready or c->write == NULL: return (:34-36).  Else sendbuf loop (:57-85); done: fd write BLOCKED (:74); limit hit: 0 ms write timer (:97-103); NXT_AGAIN: timer + enable_write (:105-118); ready_handler (:121-127) or error_handler (:129-153).",
     cite: [nxt_conn_write.c:17-154]}
  - {event: write, from: [CONNECTING], to: CONNECTING, verdict: impossible,
     note: "write_ready is 0 until connect succeeds (nxt_conn_connect.c:49); the write handler slot is the connect test."}
  - {event: write, from: [CLOSING, SHUTDOWN, CLOSE_PENDING], verdict: ignored,
     when: {er: "0", bl: "0"},
     note: "c->write == NULL (set by nxt_conn_close(), nxt_conn_close.c:37) makes the queued write handler return at nxt_conn_write.c:34-36.",
     cite: [nxt_conn_write.c:34-36]}
  - {event: write, from: [CLOSING, SHUTDOWN, CLOSE_PENDING], verdict: bug,
     note: "block_write or socket.error is set (bl:1 or er:!0): the test at nxt_conn_write.c:30-32 runs BEFORE the c->write == NULL test and jumps to `error:`, which queues c->write_state->error_handler (:150-153) -- NULL in every close state (nxt_h1proto.c:2315-2319, :3363-3367; nxt_controller.c:1116-1120; nxt_conn_proxy.c:933-937).  The engine then calls a NULL function pointer (nxt_event_engine.c:545).  M-1.",
     cite: [nxt_conn_write.c:30-36, nxt_conn_write.c:150-153]}

  # --- io (syscalls)
  - {event: io, from: [OPEN], to: OPEN, verdict: transition,
     note: "recv/readv clear read_ready on short read or EAGAIN (nxt_conn_read.c:160-161,:179,:213,:234); n == 0 sets closed (:168,:220); errors set socket.error (:187,:244).  send/writev/sendfile clear sb.ready on EAGAIN (nxt_conn_write.c:241,:342,:384) and set sb.error otherwise.",
     cite: [nxt_conn_read.c:132-252, nxt_conn_write.c:174-401]}
  - {event: io, from: [CONNECTING], to: CONNECTING, verdict: impossible,
     note: "no read/write handler runs while CONNECTING (see read/write cells)."}

  # --- fd_ready
  - {event: fd_ready, from: [CONNECTING], to: CONNECTING, verdict: transition,
     note: "EPOLLOUT: write_ready = 1, write_handler (connect test) queued (nxt_epoll_engine.c:957-967).  EPOLLERR/HUP without IN/OUT: nxt_epoll_error_handler queued (:985-1006) -> nxt_conn_connect_error (nxt_conn_connect.c:55).",
     cite: [nxt_epoll_engine.c:918-1007]}
  - {event: fd_ready, from: [OPEN], to: OPEN, verdict: transition,
     note: "sets read_ready/write_ready latches (:938,:958); queues read_handler/write_handler unless that direction is BLOCKED (:940-947,:960-967); ONESHOT -> DISABLED (:942-943).  Error with both directions blocked: latches set, nothing queued (:992-1001; level mode disables the fd).",
     cite: [nxt_epoll_engine.c:918-1007]}

  # --- fd_arm
  - {event: fd_arm, from: [CONNECTING], to: CONNECTING, verdict: transition,
     note: "enable_write (nxt_conn_connect.c:61) or nxt_epoll_enable + read BLOCKED (nxt_epoll_engine.c:1127-1128).",
     cite: [nxt_conn_connect.c:61, nxt_epoll_engine.c:1127-1128]}
  - {event: fd_arm, from: [OPEN], to: OPEN, verdict: transition,
     note: "enable_read when the read direction is disabled (nxt_conn_read.c:33,:121-123); enable_write on NXT_AGAIN (nxt_conn_write.c:115-117).  block_read/block_write are state-only, no syscall (nxt_epoll_engine.c:509-524).",
     cite: [nxt_epoll_engine.c:415-462]}

  # --- fd_del
  - {event: fd_del, from: [OPEN], to: OPEN, verdict: transition,
     note: "level-triggered engine disabling a BLOCKED direction (nxt_epoll_engine.c:948-951,:968-971,:994-998); nxt_fd_event_disable_read on the listener (nxt_conn_accept.c:277).  Not used by conn code on the edge engine.",
     cite: [nxt_epoll_engine.c:465-506]}
  - {event: fd_del, from: [CLOSE_PENDING], to: CLOSE_PENDING, verdict: ignored,
     note: "this is the DEL batched by nxt_fd_event_close() inside the close handler (nxt_conn_close.c:116, nxt_epoll_engine.c:406-412); it is logged after the handler's own line, so the conn is already CLOSE_PENDING.",
     cite: [nxt_conn_close.c:116]}

  # --- timer_add
  - {event: timer_add, from: [CONNECTING, OPEN], to: same, verdict: transition,
     note: "nxt_conn_timer() arms the state's timer when timer_value != 0 (nxt_conn.c:287-294); 0 ms write timer to postpone writing (nxt_conn_write.c:102-103); TLS shutdown timer (nxt_openssl.c:1522-1523).  `to` is the current state.",
     cite: [nxt_conn.c:282-295]}
  - {event: timer_add, from: [CLOSE_PENDING], to: CLOSE_PENDING, verdict: ignored,
     note: "the 0 ms close timer added by the close handler (nxt_conn_close.c:132-135), logged after the handler's own line.  Only timeout 0 is legal here (the checker verifies the `timeout` group).",
     when: {timeout: "0"},
     cite: [nxt_conn_close.c:135]}

  # --- close
  - {event: close, from: [CONNECTING, OPEN], to: CLOSING, verdict: transition,
     note: "precondition CONN-INV-2: c->write_state points to a state whose ready_handler releases the conn.  c->write = NULL (:37); SO_LINGER off if timedout (:39-52); error_handler = ignore (:59); shutdown handler when error == 0 && !closed && !shutdown, else close handler (:61-70).",
     cite: [nxt_conn_close.c:19-71]}
  - {event: close, from: [CREATED], verdict: impossible,
     note: "no guard in nxt_conn_close(); every caller checks c->socket.fd != -1 first (nxt_h1proto.c:3352, nxt_conn_proxy.c:954,:960).  With fd == -1 it would issue setsockopt/shutdown/close on -1 and still queue the release handler.  CONN-INV-4."}
  - {event: close, from: [CLOSING, SHUTDOWN, CLOSE_PENDING, FD_CLOSED], verdict: bug,
     note: "double close: nxt_conn_close() has no idempotence flag.  A second call queues a second close handler; the release handler then runs twice and nxt_conn_free() parks the struct twice (caught only by the debug assert nxt_conn.c:187).  The error path is guarded (error_handler = ignore, :59); other re-entries rely on callers (untrack-before-close nxt_runtime.c:512, nxt_controller.c:1143; socket.data = NULL nxt_h1proto.c:2270).  M-3.",
     cite: [nxt_conn_close.c:19-71, nxt_conn.c:187]}
  - {event: close, from: [RELEASED], verdict: impossible,
     note: "use after free; nothing holds the conn after the release handler returned (CONN-INV-13)."}

  # --- shutdown_handler
  - {event: shutdown_handler, from: [CLOSING], to: SHUTDOWN, verdict: transition,
     note: "socket.shutdown = 1; shutdown(fd, SHUT_RDWR); close handler queued.",
     cite: [nxt_conn_close.c:75-91]}

  # --- close_handler
  - {event: close_handler, from: [CLOSING, SHUTDOWN], to: CLOSE_PENDING, verdict: transition,
     note: "timers deleted (:113-114); DEL batched (:116).  events_pending == 0: fd closed and conn untracked at once (:118-122), and with no timer change pending the release handler is queued directly, i.e. FD_CLOSED (:124-128).  With epoll, events_pending is 1 whenever the fd was ever armed (nxt_epoll_engine.c:406-412), so the fd close is deferred to the 0 ms timer (:132-135).",
     cite: [nxt_conn_close.c:95-136]}

  # --- close_timer
  - {event: close_timer, from: [CLOSE_PENDING], to: CLOSE_PENDING, verdict: transition,
     note: "closes the fd if still open and untracks (:154-159), then queues the release handler (:161-162).  The fd_close event that follows moves the conn to FD_CLOSED.",
     cite: [nxt_conn_close.c:140-163]}
  - {event: close_timer, from: [FD_CLOSED], to: FD_CLOSED, verdict: ignored,
     note: "fd already -1 (closed inline by the close handler); the guard at :154 skips close(2); the release handler is queued a second time ONLY if the handler was not queued inline -- it was not, because the timer path is taken only when the inline queueing at :124-128 was skipped.",
     cite: [nxt_conn_close.c:154-162]}

  # --- fd_close
  - {event: fd_close, from: [CLOSE_PENDING], to: FD_CLOSED, verdict: transition,
     note: "close(2) by the close handler (:119) or the close timer (:155); c->socket.fd = -1; nxt_conn_untrack.",
     cite: [nxt_conn_close.c:118-122, nxt_conn_close.c:154-159]}
  - {event: fd_close, from: [CREATED], to: CREATED, verdict: ignored,
     note: "nxt_conn_socket() closes the just-created socket when bind(2) fails (nxt_conn_connect.c:122-126); the conn stays CREATED with fd == -1.",
     cite: [nxt_conn_connect.c:122-126]}

  # --- free
  - {event: free, from: [FD_CLOSED], to: RELEASED, verdict: transition,
     note: "from the release handler installed in write_state: nxt_h1p_conn_free (nxt_h1proto.c:2323-2340), nxt_h1p_peer_free (:3371-3380), nxt_controller_conn_free (nxt_controller.c:1152-1173), nxt_conn_proxy_completion (nxt_conn_proxy.c:969-987).",
     cite: [nxt_conn.c:137-207]}
  - {event: free, from: [CREATED], to: RELEASED, verdict: transition,
     note: "a conn that never got an fd: listener spare released (nxt_router.c:5193-5197), accept alloc failure (nxt_conn_accept.c:115), peer whose socket() failed (nxt_h1proto.c:3357-3359).",
     cite: [nxt_conn.c:137-207]}
  - {event: free, from: [CONNECTING, OPEN, CLOSING, SHUTDOWN, CLOSE_PENDING], verdict: impossible,
     note: "would leak the fd and leave the fd-event registered with a dangling data.ptr; nxt_conn_free() does not assert fd == -1 (M-9), callers check it (nxt_h1proto.c:3352)."}
  - {event: free, from: [RELEASED], verdict: impossible,
     note: "double free; debug builds abort on nxt_conn_is_parked (nxt_conn.c:187,:228-240); release builds would alias the freelist."}

  # --- recycle
  - {event: recycle, from: [RELEASED], to: FREE, verdict: transition,
     note: "only when both timers are quiescent (nxt_conn.c:266-268); otherwise the struct stays parked (ignored) and is retried on the next drain.",
     cite: [nxt_conn.c:257-278]}

  # --- idle_reclaim
  - {event: idle_reclaim, from: [OPEN], to: OPEN, verdict: transition,
     note: "fd pressure: read_state->close_handler called directly for up to 10 idle conns regardless of read_ready (nxt_conn_accept.c:300-327); the handler moves the conn to active and closes it (nxt_h1proto.c:1952-1963).  Runtime quit: untrack + nxt_conn_close for idle conns with read_ready == 0 (nxt_runtime.c:499-514).  The close itself is a separate event.",
     cite: [nxt_conn_accept.c:284-328, nxt_runtime.c:495-516]}

# --------------------------------------------------------------------------
# Sub-machines.  Orthogonal to the lifecycle; documented in conn.md sections
# 4 and 5 and NOT expanded into the transition grid.
sub_machines:
  tracking:
    field: c->idle
    states: [NONE, IDLE, ACTIVE]
    cite: [nxt_conn.h:170-185, nxt_conn.h:334-414]
    transitions:
      - {event: nxt_conn_idle, from: NONE, to: IDLE, cite: nxt_conn.h:344-347}
      - {event: nxt_conn_idle, from: ACTIVE, to: IDLE, cite: nxt_conn.h:339-347}
      - {event: nxt_conn_idle, from: IDLE, to: IDLE, verdict: ignored, cite: nxt_conn.h:338}
      - {event: nxt_conn_active, from: IDLE, to: ACTIVE, cite: nxt_conn.h:371-378}
      - {event: nxt_conn_active, from: [NONE, ACTIVE], to: same, verdict: ignored, cite: nxt_conn.h:371}
      - {event: nxt_conn_untrack, from: [IDLE, ACTIVE], to: NONE, cite: nxt_conn.h:401-412}
      - {event: nxt_conn_untrack, from: NONE, to: NONE, verdict: ignored, cite: nxt_conn.h:401}
  read_direction:
    fields: [c->socket.read, c->socket.read_ready, c->block_read]
    cite: [nxt_fd_event.h:11-52, nxt_epoll_engine.c:415-437, nxt_epoll_engine.c:509-515]
  write_direction:
    fields: [c->socket.write, c->socket.write_ready, c->block_write]
    cite: [nxt_fd_event.h:11-52, nxt_epoll_engine.c:440-462, nxt_epoll_engine.c:518-524]
  timer:
    fields: [node.parent (in tree), enabled, queued, change]
    cite: [nxt_timer.h:24-41, nxt_timer.c:70-122, nxt_timer.c:126-225, nxt_timer.c:281-344]

# --------------------------------------------------------------------------
# Trace replay.  How tools/fsm/trace_check.py maps a --debug unit.log onto
# the events above.  A line is keyed by (pid, ident): c->log.ident is unique
# per process (nxt_conn.c:95-97) and every conn-level nxt_debug() uses
# c->socket.task or &c->log (nxt_conn.c:90,:102-103).
trace:
  line: '^(?P<date>\S+ \S+) \[(?P<level>[a-z]+)\] (?P<pid>\d+)#(?P<tid>\d+) (?:\*(?P<ident>\d+) )?(?P<msg>.*)$'
  key: [pid, ident]
  # Events that are not logged under the conn ident.  The checker inserts
  # them when the listed follow-up event arrives in `when_in`.
  implied:
    - {event: accept, when_in: CREATED, before: [read, write, wait, fd_arm, fd_ready, timer_add, io, close, idle_reclaim],
       why: "nxt_conn_accept() logs 'accept4(L): fd' and 'client: addr' with the listener task (nxt_conn_accept.c:193,:207; nxt_epoll_engine.c:1039), not the conn ident.  Proposed log line P-1."}
    - {event: connected, when_in: CONNECTING, before: [read, write, wait, io, close],
       why: "an immediate connect(2) success (NXT_OK, nxt_conn_connect.c:48-51) has no debug line of its own; only the EINPROGRESS path logs 'in progress' and later 'epoll event conn connected' / 'event connect test'."}
  # Ordered; first match wins.  Regexes apply to the message part.
  patterns:
    - {event: create,           regex: '^connections: \d+$',                                        cite: nxt_conn.c:130}
    # 'event conn socket' (nxt_conn_connect.c:83) carries no fd; the connect(2)
    # attempt line does and is logged before the syscall (nxt_socket.c:198).
    - {event: connect,          regex: '^connect\((?P<fd>\d+), [^)]*\)$',                            cite: nxt_socket.c:198}
    - {event: connected,        regex: '^epoll event conn connected fd:(?P<fd>\d+)$',                cite: nxt_epoll_engine.c:1142}
    - {event: connected,        regex: '^event connect test fd:(?P<fd>\d+)$',                        cite: nxt_conn_connect.c:141}
    - {event: wait,             regex: '^conn wait fd:(?P<fd>-?\d+) rdy:\d+$',                       cite: nxt_conn_read.c:16}
    - {event: read,             regex: '^conn read fd:(?P<fd>-?\d+) rdy:(?P<rdy>\d) cl:(?P<cl>\d) er:(?P<er>\d+) bl:(?P<bl>\d)$', cite: nxt_conn_read.c:48}
    - {event: write,            regex: '^conn write fd:(?P<fd>-?\d+) er:(?P<er>\d+) bl:(?P<bl>\d)$', cite: nxt_conn_write.c:27}
    - {event: io,               regex: '^(?:recv|readv)\((?P<fd>\d+), ',                             cite: nxt_conn_read.c:157}
    - {event: io,               regex: '^(?:send|writev)\((?P<fd>\d+), ',                            cite: nxt_conn_write.c:331}
    - {event: io,               regex: '^sendfile\(\d+, (?P<fd>\d+), ',                              cite: nxt_conn_write.c:218}
    - {event: fd_ready,         regex: '^epoll: fd:(?P<fd>\d+) ev:(?P<ev>[0-9A-F]+) d:[0-9A-F]+ rd:(?P<rd>\d) wr:(?P<wr>\d)$', cite: nxt_epoll_engine.c:925}
    - {event: fd_del,           regex: '^epoll \d+ set event: fd:(?P<fd>\d+) op:2 ev:',              cite: nxt_epoll_engine.c:598}
    - {event: fd_arm,           regex: '^epoll \d+ set event: fd:(?P<fd>\d+) op:[13] ev:',           cite: nxt_epoll_engine.c:598}
    - {event: timer_add,        regex: '^timer add: \d+±\d+ (?P<timeout>\d+):\d+$',                  cite: nxt_timer.c:78}
    - {event: idle_reclaim,     regex: '^idle connection: (?P<fd>\d+) rdy:',                          cite: nxt_conn_accept.c:308}
    - {event: close,            regex: '^conn close fd:(?P<fd>-?\d+), to:(?P<to>\d)$',               cite: nxt_conn_close.c:30}
    - {event: shutdown_handler, regex: '^conn shutdown handler fd:(?P<fd>-?\d+)$',                   cite: nxt_conn_close.c:83}
    - {event: close_handler,    regex: '^conn close handler fd:(?P<fd>-?\d+)$',                      cite: nxt_conn_close.c:104}
    - {event: close_timer,      regex: '^conn close timer handler fd:(?P<fd>-?\d+)$',                cite: nxt_conn_close.c:150}
    - {event: fd_close,         regex: '^socket close\((?P<fd>\d+)\)$',                              cite: nxt_socket.c:289}
    # nxt_conn_free() has no debug line (proposed P-2); the release handlers do.
    - {event: free,             regex: '^h1p conn free$',                                            cite: nxt_h1proto.c:2331}
    - {event: free,             regex: '^h1p peer free$',                                            cite: nxt_h1proto.c:3377}
    - {event: free,             regex: '^controller conn free$',                                     cite: nxt_controller.c:1158}
    - {event: free,             regex: '^conn proxy completion ',                                    cite: nxt_conn_proxy.c:976}
  # Lines that legally appear after `free` under the conn ident: the two
  # nxt_timer_delete() calls inside nxt_conn_free() (nxt_conn.c:183-184)
  # and the timer change bookkeeping they cause.
  after_free_allowed:
    - '^timer delete: '
    - '^timer change: '
    - '^timer rbtree delete: '
  # Cross-checks that are not transitions.
  checks:
    fd_consistency: "every event carrying fd must match the fd recorded for the conn (first fd seen), except fd == -1 after fd_close"
    fd_not_leaked: "a conn that reaches free with a recorded fd must have passed fd_close"
    io_flags: "a read event in CLOSING/SHUTDOWN/CLOSE_PENDING is legal only with bl:1 or er:!=0 (else M-2 is live)"
